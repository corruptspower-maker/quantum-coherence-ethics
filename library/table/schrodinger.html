<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gate 2 &mdash; Schr&ouml;dinger's Lab &mdash; QCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/puzzle.css">
</head>
<body>
  <main class="pz" id="pz"></main>

  <script src="../../assets/js/gate.js"></script>
  <script src="../../assets/js/puzzle-engine.js"></script>
  <script>
    if (!QCE.has(QCE.FLAGS.LIBRARY_ENTERED)) window.location.replace('/');

    PUZZLE.mount({
      mount:   document.getElementById('pz'),
      meta:    'Gate 2 of 7 — Schrödinger’s Lab',
      title:   'The OUGHT: Beneath the Branches',
      imgBase: '../../images/schrodinger/page-',
      pages:   10,
      level:   2,
      back:    '../../desk.html',

      question: 'You opened the box. Tick everything you experienced.',
      hint:     'tick as many as apply',

      options: [
        { value: 'alive', text: 'the cat, alive' },
        { value: 'dead',  text: 'the cat, dead' },
        { value: 'both',  text: 'both — together, in one moment' },
        { value: 'copy',  text: 'one of them was me; the other was a copy of me' }
      ],

      check: function (p) {
        if (!p.__any) {
          return '<p>Nothing is ticked. Something happened when you opened it — the question is only what.</p>';
        }
        if (p.copy) {
          return '<p>You ticked the copy. This is the most reasonable wrong answer available and almost everyone reaches for it — if two of you walk out of that lab, surely only one is the original.</p>' +
                 '<p>So follow it and see where it goes. If one is a copy, there is a fact about which one you are, and nothing in the world could tell you which. Both remember walking in. Both did. The question stops meaning anything, and that is usually a sign it was the wrong question.</p>' +
                 '<p>Identity did not survive by staying single. It branched. Neither is a copy, because neither is a reproduction of the other — they are both continuations of you.</p>';
        }
        if (p.both) {
          return '<p>You ticked <em>both, in one moment</em>. That is the picture where the cat is smeared across two states and your looking tidies it up — where the strange thing is a blur that resolves.</p>' +
                 '<p>But nobody has ever had that experience. Not you, not Shrody, not the cat. There is no moment in the story where both are present together, which is why the page that would have shown it could not be drawn.</p>' +
                 '<p>The claim is stranger and plainer than the blur: both happened, wholly, and neither needed the other in the frame to be real.</p>';
        }
        if (!(p.alive && p.dead)) {
          return '<p>You ticked one. That is the reading where the box held a fact all along and opening it told you which fact — the cat was already alive, or already dead, and you merely found out.</p>' +
                 '<p>But nothing in what happened selected an outcome. Both occurred. You are reporting one of them and calling it the whole event, which is exactly what it feels like from inside a single branch: complete, and quiet about the rest.</p>' +
                 '<p>Read it again. Count what you experienced, not what you concluded.</p>';
        }
        return null;
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Gate 4 &mdash; The Equation &mdash; QCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/puzzle.css">
</head>
<body>
  <main class="pz" id="pz"></main>

  <script src="../../assets/js/gate.js"></script>
  <script src="../../assets/js/puzzle-engine.js"></script>
  <script>
    if (!QCE.has(QCE.FLAGS.LIBRARY_ENTERED)) window.location.replace('/');

    PUZZLE.mount({
      mount:   document.getElementById('pz'),
      meta:    'Gate 4 of 7 — The Equation',
      title:   'The OUGHT: Beneath the Branches',
      imgBase: '../../images/equation/page-',
      pages:   5,
      level:   4,
      back:    '../../desk.html',

      question: 'The equation is on the wall in front of you. Tick everything it is doing.',
      hint:     'tick as many as apply',

      options: [
        { value: 'rank',  text: 'Ranking the branches by how much each one matters.' },
        { value: 'tell',  text: 'Telling me which action to take.' },
        { value: 'push',  text: 'Handing me a quantity to push upward.' },
        { value: 'stake', text: 'Showing me what is at stake in what I am already doing.' }
      ],

      check: function (p) {
        if (!p.__any) {
          return '<p>Nothing is ticked. It is doing <em>something</em> — it is right there on the wall, and you have been reading it. The question is which of these four it actually is.</p>';
        }
        if (p.push) {
          return '<p>You ticked the quantity. This is the one almost everyone takes, because a number you can push is a number you can act on, and it converts a difficult argument into a task.</p>' +
                 '<p>But look at what you just spent five pages doing. The thermometer had a number on it too. Turning it, shaking it and shouting at it did not warm one drop of water, because the number was never the thing you had hold of.</p>' +
                 '<p>And notice what the target does to you: if the instruction were <em>maximise</em>, then anything short of the maximum is failure, and you would be permanently failing. It never said that. Net positive is enough. One degree compounds.</p>';
        }
        if (p.tell) {
          return '<p>You ticked <em>telling me which action to take</em>. This is a fair thing to want. Most ethical frameworks you have met were built to answer exactly that, and one that will not answer it can feel broken.</p>' +
                 '<p>But it is not broken, it is a different instrument. A thermometer that refused to say what to do would not be faulty. It tells you the temperature. What you do about the temperature is yours — and it stays yours, which is the part that matters.</p>' +
                 '<p>You went looking for the knob. The knob is real, and it is not on the dial.</p>';
        }
        if (p.rank) {
          return '<p>You ticked the ranking. This one is subtler than the others and it goes wrong in a specific place.</p>' +
                 '<p>Branch weight is an ontological measure, not a moral one. Reading it as importance means the people in a thin branch matter less — that they are somehow partial. But there is nobody in any branch who is a fraction of a person. Inside every one of them, P = 1.</p>' +
                 '<p>The measure is a view from outside the branching. Nobody has ever lived there.</p>';
        }
        if (!p.stake) {
          return '<p>You have ruled out three things it is not, which is most of the work. But you left the fourth unticked, so the equation is now doing nothing at all.</p>' +
                 '<p>It is doing something. It is descriptive rather than prescriptive, and describing is not the same as being silent — a reading is real information about a real situation. It shows you the shape of what you are already in the middle of.</p>';
        }
        return null;
      }
    });
  </script>
</body>
</html>

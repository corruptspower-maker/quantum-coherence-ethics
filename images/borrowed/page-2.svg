<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="500" x2="770" y2="500" stroke-width="3"/>

    <!-- a single branch, curving, close up -->
    <path d="M 250 500 Q 300 340 430 268 Q 540 208 640 216" stroke-width="12"/>
    <path d="M 392 292 Q 430 220 400 158" stroke-width="6"/>
    <path d="M 520 236 Q 566 176 640 158" stroke-width="6"/>

    <!-- THE RULER. dead straight. held against the curve. -->
    <g transform="rotate(-24, 440, 300)">
      <rect x="286" y="286" width="308" height="30" stroke-width="5"/>
      <line x1="316" y1="286" x2="316" y2="300" stroke-width="3"/>
      <line x1="346" y1="286" x2="346" y2="296" stroke-width="3"/>
      <line x1="376" y1="286" x2="376" y2="300" stroke-width="3"/>
      <line x1="406" y1="286" x2="406" y2="296" stroke-width="3"/>
      <line x1="436" y1="286" x2="436" y2="300" stroke-width="3"/>
      <line x1="466" y1="286" x2="466" y2="296" stroke-width="3"/>
      <line x1="496" y1="286" x2="496" y2="300" stroke-width="3"/>
      <line x1="526" y1="286" x2="526" y2="296" stroke-width="3"/>
      <line x1="556" y1="286" x2="556" y2="300" stroke-width="3"/>
      <text x="440" y="311" font-family="Georgia,serif" font-size="17" fill="#5c1212"
            text-anchor="middle" stroke="none" letter-spacing="3">UTILITARIANISM</text>
    </g>

    <!-- the gap the ruler cannot close -->
    <g stroke-width="2.5" opacity="0.6">
      <line x1="330" y1="404" x2="330" y2="440"/>
      <line x1="366" y1="378" x2="366" y2="424"/>
      <line x1="404" y1="356" x2="404" y2="404"/>
    </g>
  </g>

  <text x="600" y="410" font-family="'Comic Sans MS',cursive" font-size="18" fill="#1a1a2e"
        transform="rotate(-4, 600, 410)">the ruler is fine</text>
  <text x="600" y="434" font-family="'Comic Sans MS',cursive" font-size="18" fill="#1a1a2e"
        transform="rotate(-4, 600, 434)">the ruler is straight</text>

  <text x="400" y="562" font-family="Georgia,serif" font-size="27" font-style="italic"
        fill="#5c1212" text-anchor="middle">The first one did not reach.</text>
</svg>

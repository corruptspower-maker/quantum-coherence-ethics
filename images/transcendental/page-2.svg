<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="500" x2="770" y2="500" stroke-width="3"/>
    <!-- the objector, arms folded -->
    <circle cx="222" cy="288" r="31" stroke-width="5"/>
    <circle cx="234" cy="282" r="3.2" fill="#5c1212" stroke="none"/>
    <circle cx="212" cy="282" r="3.2" fill="#5c1212" stroke="none"/>
    <path d="M 210 312 Q 222 304 234 312" stroke-width="3.4"/>
    <line x1="222" y1="319" x2="222" y2="408" stroke-width="5.5"/>
    <line x1="222" y1="342" x2="266" y2="358" stroke-width="4.5"/>
    <line x1="266" y1="358" x2="186" y2="352" stroke-width="4.5"/>
    <line x1="222" y1="356" x2="258" y2="344" stroke-width="4.5"/>
    <line x1="222" y1="408" x2="198" y2="468" stroke-width="4.5"/>
    <line x1="198" y1="468" x2="180" y2="492" stroke-width="4.5"/>
    <line x1="222" y1="408" x2="248" y2="468" stroke-width="4.5"/>
    <line x1="248" y1="468" x2="268" y2="492" stroke-width="4.5"/>
    <!-- bubble -->
    <path d="M 320 168 L 736 168 A 14 14 0 0 1 750 182 L 750 288 A 14 14 0 0 1 736 302
             L 356 302 L 320 330 L 330 302 A 14 14 0 0 1 316 288
             L 316 182 A 14 14 0 0 1 330 168 Z" stroke-width="4.5"/>
  </g>
  <text x="533" y="212" font-family="Georgia,serif" font-size="24" font-style="italic"
        fill="#5c1212" text-anchor="middle">&#8220;Even if all of this is true,</text>
  <text x="533" y="248" font-family="Georgia,serif" font-size="24" font-style="italic"
        fill="#5c1212" text-anchor="middle">you have not shown me</text>
  <text x="533" y="284" font-family="Georgia,serif" font-size="24" font-style="italic"
        fill="#5c1212" text-anchor="middle">why I should care.&#8221;</text>
  <text x="400" y="566" font-family="Georgia,serif" font-size="27" font-style="italic"
        fill="#5c1212" text-anchor="middle">And that is right.</text>
</svg>

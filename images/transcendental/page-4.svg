<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">
    <!-- the same two platforms, pulled back -->
    <line x1="118" y1="268" x2="332" y2="268" stroke-width="7"/>
    <line x1="140" y1="268" x2="140" y2="420" stroke-width="5"/>
    <line x1="310" y1="268" x2="310" y2="420" stroke-width="5"/>
    <line x1="468" y1="268" x2="682" y2="268" stroke-width="7"/>
    <line x1="490" y1="268" x2="490" y2="420" stroke-width="5"/>
    <line x1="660" y1="268" x2="660" y2="420" stroke-width="5"/>
    <!-- one floor, under both of them -->
    <line x1="30" y1="420" x2="770" y2="420" stroke-width="8"/>
    <g stroke-width="3" opacity="0.4">
      <line x1="70"  y1="420" x2="46"  y2="462"/>
      <line x1="150" y1="420" x2="126" y2="462"/>
      <line x1="230" y1="420" x2="206" y2="462"/>
      <line x1="310" y1="420" x2="286" y2="462"/>
      <line x1="390" y1="420" x2="366" y2="462"/>
      <line x1="470" y1="420" x2="446" y2="462"/>
      <line x1="550" y1="420" x2="526" y2="462"/>
      <line x1="630" y1="420" x2="606" y2="462"/>
      <line x1="710" y1="420" x2="686" y2="462"/>
      <line x1="770" y1="420" x2="746" y2="462"/>
    </g>
    <!-- down on it, looking at what holds both -->
    <circle cx="400" cy="292" r="27" stroke-width="4.5"/>
    <circle cx="410" cy="286" r="2.8" fill="#5c1212" stroke="none"/>
    <circle cx="390" cy="286" r="2.8" fill="#5c1212" stroke="none"/>
    <line x1="391" y1="307" x2="409" y2="307" stroke-width="3"/>
    <line x1="400" y1="319" x2="400" y2="376" stroke-width="5"/>
    <line x1="400" y1="334" x2="372" y2="304" stroke-width="4"/>
    <line x1="400" y1="334" x2="428" y2="304" stroke-width="4"/>
    <line x1="400" y1="376" x2="380" y2="418" stroke-width="4"/>
    <line x1="400" y1="376" x2="420" y2="418" stroke-width="4"/>
  </g>
  <text x="225" y="308" font-family="Georgia,serif" font-size="20" fill="#5c1212"
        text-anchor="middle" letter-spacing="5">IS</text>
  <text x="575" y="308" font-family="Georgia,serif" font-size="20" fill="#5c1212"
        text-anchor="middle" letter-spacing="5">OUGHT</text>
  <text x="400" y="540" font-family="Georgia,serif" font-size="27" font-style="italic"
        fill="#5c1212" text-anchor="middle">It works underneath. It always did.</text>
  <text x="400" y="580" font-family="Georgia,serif" font-size="27" font-style="italic"
        fill="#5c1212" text-anchor="middle">Both of them are standing on something.</text>
</svg>

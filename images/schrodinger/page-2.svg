<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">

    <line x1="30" y1="492" x2="770" y2="492" stroke-width="3"/>

    <!-- desk -->
    <line x1="360" y1="392" x2="700" y2="392" stroke-width="7"/>
    <line x1="384" y1="392" x2="384" y2="492" stroke-width="5"/>
    <line x1="676" y1="392" x2="676" y2="492" stroke-width="5"/>

    <!-- MONITOR, glowing, full of cats -->
    <rect x="452" y="236" width="176" height="126" rx="6" stroke-width="6"/>
    <line x1="540" y1="362" x2="540" y2="386" stroke-width="5"/>
    <line x1="510" y1="388" x2="570" y2="388" stroke-width="5"/>
    <!-- glow -->
    <line x1="436" y1="228" x2="422" y2="212" stroke-width="3" opacity="0.65"/>
    <line x1="540" y1="222" x2="540" y2="202" stroke-width="3" opacity="0.65"/>
    <line x1="644" y1="228" x2="658" y2="212" stroke-width="3" opacity="0.65"/>
    <!-- cat on screen 1 -->
    <circle cx="500" cy="292" r="19" stroke-width="3"/>
    <path d="M 486 279 L 483 264 L 496 273" stroke-width="3"/>
    <path d="M 514 279 L 517 264 L 504 273" stroke-width="3"/>
    <circle cx="494" cy="289" r="2" fill="#5c1212" stroke="none"/>
    <circle cx="506" cy="289" r="2" fill="#5c1212" stroke="none"/>
    <line x1="478" y1="296" x2="466" y2="293" stroke-width="1.8"/>
    <line x1="522" y1="296" x2="534" y2="293" stroke-width="1.8"/>
    <!-- cat on screen 2 -->
    <circle cx="578" cy="316" r="16" stroke-width="3"/>
    <path d="M 566 305 L 563 292 L 574 300" stroke-width="3"/>
    <path d="M 590 305 L 593 292 L 582 300" stroke-width="3"/>
    <circle cx="573" cy="314" r="1.8" fill="#5c1212" stroke="none"/>
    <circle cx="583" cy="314" r="1.8" fill="#5c1212" stroke="none"/>
    <!-- play triangle -->
    <path d="M 466 336 L 480 344 L 466 352 Z" stroke-width="2.5"/>

    <!-- SHRODY — wild hair, goggles pushed up, looking UP from the screen -->
    <circle cx="270" cy="300" r="33" stroke-width="5"/>
    <!-- mad hair -->
    <line x1="250" y1="274" x2="240" y2="248" stroke-width="4"/>
    <line x1="262" y1="269" x2="257" y2="240" stroke-width="4"/>
    <line x1="276" y1="268" x2="282" y2="239" stroke-width="4"/>
    <line x1="289" y1="273" x2="301" y2="248" stroke-width="4"/>
    <line x1="298" y1="282" x2="322" y2="266" stroke-width="4"/>
    <!-- eyes, looking up and over -->
    <circle cx="281" cy="291" r="3.4" fill="#5c1212" stroke="none"/>
    <circle cx="299" cy="293" r="3.4" fill="#5c1212" stroke="none"/>
    <!-- goggles pushed up on forehead -->
    <circle cx="256" cy="266" r="8" stroke-width="3"/>
    <circle cx="276" cy="264" r="8" stroke-width="3"/>
    <line x1="264" y1="265" x2="268" y2="265" stroke-width="3"/>
    <!-- flat unbothered mouth -->
    <line x1="278" y1="312" x2="300" y2="313" stroke-width="3.5"/>
    <!-- lab coat body -->
    <line x1="270" y1="333" x2="270" y2="412" stroke-width="5.5"/>
    <path d="M 270 341 L 246 372 L 250 398" stroke-width="4.5"/>
    <path d="M 270 341 L 300 368 L 330 380" stroke-width="4.5"/>
    <line x1="270" y1="412" x2="252" y2="472" stroke-width="4.5"/>
    <line x1="270" y1="412" x2="290" y2="472" stroke-width="4.5"/>
    <line x1="252" y1="472" x2="238" y2="490" stroke-width="4.5"/>
    <line x1="290" y1="472" x2="304" y2="490" stroke-width="4.5"/>

  </g>

  <text x="400" y="560" font-family="Georgia,serif" font-size="27" font-style="italic"
        fill="#5c1212" text-anchor="middle">&#8212;&#8202;catch him looking up from his cat videos&#8212;</text>
</svg>

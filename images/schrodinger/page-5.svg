<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">

    <line x1="30" y1="486" x2="770" y2="486" stroke-width="3"/>

    <!-- SHRODY, left, deadpan -->
    <circle cx="238" cy="300" r="33" stroke-width="5"/>
    <line x1="218" y1="274" x2="208" y2="248" stroke-width="4"/>
    <line x1="230" y1="269" x2="225" y2="240" stroke-width="4"/>
    <line x1="244" y1="268" x2="250" y2="239" stroke-width="4"/>
    <line x1="257" y1="273" x2="269" y2="248" stroke-width="4"/>
    <circle cx="227" cy="294" r="3.4" fill="#5c1212" stroke="none"/>
    <circle cx="249" cy="294" r="3.4" fill="#5c1212" stroke="none"/>
    <circle cx="230" cy="278" r="9" stroke-width="3"/>
    <circle cx="250" cy="277" r="9" stroke-width="3"/>
    <line x1="239" y1="278" x2="241" y2="278" stroke-width="3"/>
    <!-- perfectly flat mouth. no notes. -->
    <line x1="226" y1="315" x2="250" y2="315" stroke-width="3.5"/>
    <line x1="238" y1="333" x2="238" y2="412" stroke-width="5.5"/>

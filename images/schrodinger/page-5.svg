    <line x1="238" y1="412" x2="220" y2="470" stroke-width="4.5"/>
    <line x1="238" y1="412" x2="256" y2="470" stroke-width="4.5"/>
    <line x1="220" y1="470" x2="206" y2="486" stroke-width="4.5"/>
    <line x1="256" y1="470" x2="270" y2="486" stroke-width="4.5"/>

    <!-- speech bubble -->
    <path d="M 300 196 L 452 196 A 14 14 0 0 1 466 210 L 466 268 A 14 14 0 0 1 452 282
             L 336 282 L 306 306 L 314 282 L 300 282 A 14 14 0 0 1 286 268
             L 286 210 A 14 14 0 0 1 300 196 Z" stroke-width="4.5"/>

    <!-- OUR GUY, right, ears still on, dawning realisation -->
    <circle cx="576" cy="288" r="33" stroke-width="5"/>
    <path d="M 548 271 L 541 231 L 569 257" stroke-width="4.5"/>
    <path d="M 549 265 L 545 238 L 564 255" stroke-width="2.5"/>
    <path d="M 604 271 L 611 231 L 583 257" stroke-width="4.5"/>
    <path d="M 603 265 L 607 238 L 588 255" stroke-width="2.5"/>
    <circle cx="565" cy="282" r="3.2" fill="#5c1212" stroke="none"/>
    <circle cx="587" cy="282" r="3.2" fill="#5c1212" stroke="none"/>
    <path d="M 564 306 Q 576 299 588 306" stroke-width="3.5"/>
    <line x1="576" y1="321" x2="576" y2="404" stroke-width="5.5"/>
    <line x1="576" y1="336" x2="540" y2="374" stroke-width="4.5"/>
    <line x1="576" y1="336" x2="614" y2="372" stroke-width="4.5"/>
    <line x1="576" y1="404" x2="556" y2="468" stroke-width="4.5"/>
    <line x1="576" y1="404" x2="596" y2="468" stroke-width="4.5"/>
    <line x1="556" y1="468" x2="540" y2="486" stroke-width="4.5"/>
    <line x1="596" y1="468" x2="612" y2="486" stroke-width="4.5"/>

  </g>

  <text x="376" y="252" font-family="Georgia,serif" font-size="46" font-style="italic"
        fill="#5c1212" text-anchor="middle">&#8220;Nyan.&#8221;</text>

  <text x="650" y="212" font-family="'Comic Sans MS',cursive" font-size="17" fill="#1a1a2e" transform="rotate(-4, 650, 212)">O-M-G is he ever</text>
  <text x="650" y="234" font-family="'Comic Sans MS',cursive" font-size="17" fill="#1a1a2e" transform="rotate(-4, 650, 234)">gonna grow out of</text>
  <text x="650" y="256" font-family="'Comic Sans MS',cursive" font-size="17" fill="#1a1a2e" transform="rotate(-4, 650, 256)">this weeb phase.</text>
  <text x="650" y="280" font-family="'Comic Sans MS',cursive" font-size="17" fill="#1a1a2e" transform="rotate(-4, 650, 280)">Baka.</text>

  <text x="400" y="566" font-family="Georgia,serif" font-size="26" font-style="italic"
        fill="#5c1212" text-anchor="middle">&#8212;&#8202;and Shrody just goes&#8212;</text>

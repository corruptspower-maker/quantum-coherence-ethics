<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">

    <!-- floor -->
    <line x1="30" y1="492" x2="770" y2="492" stroke-width="3"/>

    <!-- doorway arch, left -->
    <path d="M 60 492 L 60 250 A 75 75 0 0 1 210 250 L 210 492" stroke-width="7"/>
    <line x1="90" y1="492" x2="90" y2="285" stroke-width="2" opacity="0.4"/>

    <!-- LAB BENCH -->
    <line x1="410" y1="378" x2="742" y2="378" stroke-width="7"/>
    <line x1="432" y1="378" x2="432" y2="492" stroke-width="5"/>
    <line x1="720" y1="378" x2="720" y2="492" stroke-width="5"/>

    <!-- conical flask -->
    <path d="M 472 320 L 472 342 L 452 374 L 508 374 L 488 342 L 488 320 Z" stroke-width="4"/>
    <line x1="466" y1="320" x2="494" y2="320" stroke-width="4"/>
    <path d="M 458 366 Q 480 358 502 366" stroke-width="3"/>
    <circle cx="470" cy="300" r="4" stroke-width="2.5"/>
    <circle cx="484" cy="284" r="3" stroke-width="2.5"/>
    <circle cx="474" cy="268" r="5" stroke-width="2.5"/>

    <!-- tall tube in stand -->
    <rect x="556" y="296" width="26" height="82" rx="3" stroke-width="4"/>
    <line x1="548" y1="378" x2="590" y2="378" stroke-width="4"/>
    <path d="M 560 352 L 578 352 L 578 374 L 560 374 Z" stroke-width="2.5" opacity="0.55"/>

    <!-- round-bottom flask -->
    <circle cx="662" cy="348" r="28" stroke-width="4"/>
    <line x1="662" y1="320" x2="662" y2="296" stroke-width="4"/>
    <line x1="652" y1="294" x2="672" y2="294" stroke-width="4"/>
    <circle cx="655" cy="352" r="4" stroke-width="2" opacity="0.6"/>
    <circle cx="670" cy="344" r="3" stroke-width="2" opacity="0.6"/>

    <!-- OUR GUY — mid-stride, coming through the door -->
    <circle cx="286" cy="286" r="31" stroke-width="5"/>
    <circle cx="274" cy="279" r="3.2" fill="#5c1212" stroke="none"/>
    <circle cx="298" cy="279" r="3.2" fill="#5c1212" stroke="none"/>
    <path d="M 273 297 Q 286 306 299 297" stroke-width="3.5"/>
    <!-- body -->
    <line x1="286" y1="317" x2="286" y2="396" stroke-width="5.5"/>
    <!-- arms, swinging -->
    <line x1="286" y1="334" x2="246" y2="368" stroke-width="4.5"/>
    <line x1="286" y1="334" x2="330" y2="356" stroke-width="4.5"/>
    <!-- legs, mid-stride -->
    <line x1="286" y1="396" x2="256" y2="470" stroke-width="4.5"/>
    <line x1="256" y1="470" x2="240" y2="490" stroke-width="4.5"/>
    <line x1="286" y1="396" x2="326" y2="452" stroke-width="4.5"/>
    <line x1="326" y1="452" x2="348" y2="488" stroke-width="4.5"/>

  </g>

  <text x="400" y="560" font-family="Georgia,serif" font-size="27" font-style="italic"
        fill="#5c1212" text-anchor="middle">I roll up into Shrody&#8217;s mad lab&#8202;&#8212;</text>
</svg>

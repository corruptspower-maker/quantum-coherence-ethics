<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>

  <!-- the panel that could not be drawn -->
  <rect x="204" y="128" width="392" height="286" rx="4" fill="none"
        stroke="#5c1212" stroke-width="6"/>

  <!-- faint rubbed-out attempts -->
  <g fill="none" stroke="#5c1212" stroke-linecap="round" opacity="0.17">
    <path d="M 268 236 Q 300 200 336 240 Q 302 268 268 236" stroke-width="3"/>
    <path d="M 300 208 L 292 184 L 314 200" stroke-width="3"/>
    <path d="M 430 268 Q 466 232 500 272" stroke-width="3"/>
    <line x1="446" y1="248" x2="470" y2="270" stroke-width="3"/>
    <line x1="470" y1="248" x2="446" y2="270" stroke-width="3"/>
    <path d="M 246 300 L 552 300" stroke-width="2.5"/>
    <path d="M 260 316 L 540 310" stroke-width="2.5"/>
    <path d="M 252 328 L 548 334" stroke-width="2.5"/>
    <path d="M 268 344 L 528 340" stroke-width="2.5"/>
  </g>

  <line x1="654" y1="266" x2="612" y2="266" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M 612 266 l 8 -4 l -2 8" fill="#1a1a2e"/>
  <text x="662" y="260" font-family="'Comic Sans MS',cursive" font-size="18" fill="#1a1a2e"
        transform="rotate(-4, 662, 260)">couldn&#8217;t draw</text>
  <text x="662" y="284" font-family="'Comic Sans MS',cursive" font-size="18" fill="#1a1a2e"
        transform="rotate(-4, 662, 284)">this one</text>

  <text x="400" y="490" font-family="Georgia,serif" font-size="26" font-style="italic"
        fill="#5c1212" text-anchor="middle">And the thing I do not experience is both of those</text>
  <text x="400" y="524" font-family="Georgia,serif" font-size="26" font-style="italic"
        fill="#5c1212" text-anchor="middle">inside one concomitant experience&#8212;</text>
</svg>

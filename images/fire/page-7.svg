<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="500" x2="770" y2="500" stroke-width="3"/>
    <line x1="490" y1="492" x2="618" y2="462" stroke-width="9"/>
    <line x1="494" y1="462" x2="622" y2="492" stroke-width="9"/>
    <line x1="500" y1="478" x2="612" y2="476" stroke-width="8"/>
    <line x1="486" y1="452" x2="622" y2="452" stroke-width="8"/>
    <line x1="498" y1="436" x2="610" y2="436" stroke-width="8"/>
    <path d="M 492 452 Q 470 350 528 274 Q 518 344 556 300 Q 596 226 566 172
             Q 646 236 624 340 Q 656 302 650 254 Q 700 356 616 452 Z" stroke-width="5.5"/>
    <path d="M 528 448 Q 514 372 560 322 Q 554 380 586 344 Q 604 396 574 448 Z" stroke-width="4"/>
    <g stroke-width="3" opacity="0.65">
      <line x1="672" y1="212" x2="700" y2="186"/>
      <line x1="452" y1="252" x2="424" y2="228"/>
      <line x1="700" y1="300" x2="730" y2="288"/>
    </g>
    <line x1="704" y1="492" x2="752" y2="492" stroke-width="8"/>

    <!-- our guy, staggering under a cradled armful -->
    <circle cx="238" cy="292" r="31" stroke-width="5"/>
    <circle cx="250" cy="285" r="3.2" fill="#5c1212" stroke="none"/>
    <circle cx="228" cy="285" r="3.2" fill="#5c1212" stroke="none"/>
    <ellipse cx="240" cy="309" rx="8" ry="10" stroke-width="3.2"/>
    <line x1="238" y1="323" x2="244" y2="408" stroke-width="5.5"/>
    <!-- arms cradling, well below the head -->
    <line x1="239" y1="346" x2="272" y2="382" stroke-width="4.5"/>
    <line x1="241" y1="366" x2="276" y2="416" stroke-width="4.5"/>
    <line x1="244" y1="408" x2="218" y2="470" stroke-width="4.5"/>
    <line x1="218" y1="470" x2="200" y2="494" stroke-width="4.5"/>
    <line x1="244" y1="408" x2="274" y2="468" stroke-width="4.5"/>
    <line x1="274" y1="468" x2="294" y2="494" stroke-width="4.5"/>
    <!-- the armful, held out in front, chest height and lower -->
    <line x1="268" y1="378" x2="368" y2="368" stroke-width="7"/>
    <line x1="270" y1="396" x2="372" y2="390" stroke-width="7"/>
    <line x1="272" y1="414" x2="368" y2="412" stroke-width="7"/>
    <line x1="276" y1="432" x2="360" y2="434" stroke-width="7"/>
  </g>
  <text x="400" y="548" font-family="Georgia,serif" font-size="26" font-style="italic"
        fill="#5c1212" text-anchor="middle">I could have done this instead.</text>
  <text x="400" y="588" font-family="Georgia,serif" font-size="26" font-style="italic"
        fill="#5c1212" text-anchor="middle">It would not have been more kept.</text>
</svg>

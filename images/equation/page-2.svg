<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="500" x2="770" y2="500" stroke-width="3"/>

    <!-- close on the thermometer, both hands on it, twisting -->
    <rect x="382" y="156" width="40" height="252" rx="20" stroke-width="7"/>
    <circle cx="402" cy="424" r="28" stroke-width="7"/>
    <line x1="402" y1="396" x2="402" y2="320" stroke-width="11"/>
    <line x1="426" y1="200" x2="446" y2="200" stroke-width="3"/>
    <line x1="426" y1="236" x2="442" y2="236" stroke-width="3"/>
    <line x1="426" y1="272" x2="446" y2="272" stroke-width="3"/>
    <line x1="426" y1="308" x2="442" y2="308" stroke-width="3"/>
    <line x1="426" y1="344" x2="446" y2="344" stroke-width="3"/>

    <!-- two hands gripping, turning -->
    <circle cx="352" cy="228" r="22" stroke-width="5"/>
    <line x1="336" y1="212" x2="326" y2="200" stroke-width="3"/>
    <line x1="348" y1="206" x2="344" y2="192" stroke-width="3"/>
    <line x1="330" y1="228" x2="278" y2="248" stroke-width="5.5"/>
    <circle cx="452" cy="300" r="22" stroke-width="5"/>
    <line x1="468" y1="316" x2="478" y2="328" stroke-width="3"/>
    <line x1="456" y1="322" x2="460" y2="336" stroke-width="3"/>
    <line x1="474" y1="300" x2="528" y2="282" stroke-width="5.5"/>

    <!-- turning arrows -->
    <path d="M 318 158 A 96 96 0 0 1 470 148" stroke-width="4"/>
    <path d="M 470 148 l -14 -8 l 2 15" fill="#5c1212" stroke="none"/>
    <path d="M 486 388 A 96 96 0 0 1 336 400" stroke-width="4"/>
    <path d="M 336 400 l 14 8 l -2 -15" fill="#5c1212" stroke="none"/>
  </g>

  <text x="400" y="562" font-family="Georgia,serif" font-size="27" font-style="italic"
        fill="#5c1212" text-anchor="middle">So I tried to make the number bigger.</text>
</svg>

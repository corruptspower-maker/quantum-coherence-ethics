<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="500" x2="770" y2="500" stroke-width="3"/>

    <!-- STOVE, and the knob nobody has touched -->
    <rect x="416" y="392" width="288" height="108" stroke-width="6"/>
    <line x1="416" y1="392" x2="704" y2="392" stroke-width="6"/>
    <circle cx="462" cy="446" r="24" stroke-width="6"/>
    <line x1="462" y1="446" x2="462" y2="426" stroke-width="5"/>
    <circle cx="462" cy="446" r="5" stroke-width="3"/>
    <line x1="440" y1="424" x2="434" y2="416" stroke-width="2.5" opacity="0.5"/>
    <line x1="484" y1="424" x2="490" y2="416" stroke-width="2.5" opacity="0.5"/>
    <line x1="516" y1="430" x2="686" y2="430" stroke-width="2.5" opacity="0.3"/>

    <!-- POT, cold -->
    <path d="M 500 392 L 488 312 L 652 312 L 640 392 Z" stroke-width="6"/>
    <line x1="480" y1="312" x2="660" y2="312" stroke-width="6"/>
    <path d="M 660 318 Q 688 332 664 352" stroke-width="4.5"/>
    <path d="M 500 346 Q 570 332 640 346" stroke-width="3" opacity="0.5"/>

    <!-- thermometer, still being worked on -->
    <g transform="rotate(-16, 566, 296)">
      <rect x="554" y="180" width="24" height="172" rx="12" stroke-width="5"/>
      <circle cx="566" cy="360" r="18" stroke-width="5"/>
      <line x1="566" y1="342" x2="566" y2="298" stroke-width="7"/>
      <line x1="580" y1="216" x2="592" y2="216" stroke-width="2.5"/>
      <line x1="580" y1="252" x2="590" y2="252" stroke-width="2.5"/>
      <line x1="580" y1="288" x2="592" y2="288" stroke-width="2.5"/>
    </g>

    <!-- our guy, still at the wrong object -->
    <circle cx="238" cy="298" r="31" stroke-width="5"/>
    <circle cx="250" cy="291" r="3.2" fill="#5c1212" stroke="none"/>
    <circle cx="228" cy="291" r="3.2" fill="#5c1212" stroke="none"/>
    <path d="M 226 318 Q 238 310 250 318" stroke-width="3.4"/>
    <line x1="238" y1="329" x2="238" y2="410" stroke-width="5.5"/>
    <line x1="238" y1="346" x2="204" y2="384" stroke-width="4.5"/>
    <line x1="238" y1="346" x2="318" y2="300" stroke-width="4.5"/>
    <line x1="238" y1="410" x2="216" y2="470" stroke-width="4.5"/>
    <line x1="238" y1="410" x2="260" y2="470" stroke-width="4.5"/>
    <line x1="216" y1="470" x2="200" y2="494" stroke-width="4.5"/>
    <line x1="260" y1="470" x2="278" y2="494" stroke-width="4.5"/>

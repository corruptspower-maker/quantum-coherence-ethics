  <line x1="392" y1="372" x2="446" y2="428" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M 446 428 l -2 -9 l 9 4" fill="#1a1a2e"/>
  <text x="384" y="366" font-family="'Comic Sans MS',cursive" font-size="18" fill="#1a1a2e"
        text-anchor="end" transform="rotate(-4, 384, 366)">this one turns</text>

  <text x="400" y="562" font-family="Georgia,serif" font-size="27" font-style="italic"
        fill="#5c1212" text-anchor="middle">The knob had been there the whole time.</text>

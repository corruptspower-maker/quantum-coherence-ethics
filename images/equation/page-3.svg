<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="500" x2="770" y2="500" stroke-width="3"/>

    <!-- our guy, arm up, shaking it, shouting -->
    <circle cx="330" cy="288" r="33" stroke-width="5"/>
    <path d="M 310 276 Q 318 268 326 276" stroke-width="3.4"/>
    <path d="M 334 276 Q 342 268 350 276" stroke-width="3.4"/>
    <ellipse cx="330" cy="306" rx="12" ry="15" stroke-width="4"/>
    <line x1="330" y1="321" x2="330" y2="408" stroke-width="5.5"/>
    <line x1="330" y1="340" x2="290" y2="376" stroke-width="4.5"/>
    <!-- raised shaking arm -->
    <line x1="330" y1="340" x2="392" y2="272" stroke-width="4.5"/>
    <line x1="330" y1="408" x2="304" y2="470" stroke-width="4.5"/>
    <line x1="304" y1="470" x2="286" y2="494" stroke-width="4.5"/>
    <line x1="330" y1="408" x2="360" y2="470" stroke-width="4.5"/>
    <line x1="360" y1="470" x2="382" y2="494" stroke-width="4.5"/>

    <!-- the thermometer, held aloft, utterly unmoved -->
    <g transform="rotate(24, 410, 230)">
      <rect x="398" y="130" width="26" height="130" rx="13" stroke-width="5"/>
      <circle cx="411" cy="268" r="17" stroke-width="5"/>
      <line x1="411" y1="252" x2="411" y2="224" stroke-width="7"/>
      <line x1="426" y1="160" x2="438" y2="160" stroke-width="2.5"/>
      <line x1="426" y1="186" x2="436" y2="186" stroke-width="2.5"/>
      <line x1="426" y1="212" x2="438" y2="212" stroke-width="2.5"/>
    </g>

    <!-- shake lines -->
    <g stroke-width="3" opacity="0.7">
      <line x1="470" y1="152" x2="496" y2="138"/>
      <line x1="478" y1="182" x2="508" y2="176"/>
      <line x1="352" y1="146" x2="326" y2="130"/>
      <line x1="346" y1="176" x2="316" y2="168"/>
    </g>
  </g>

  <line x1="596" y1="272" x2="500" y2="248" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M 500 248 l 9 -2 l -4 8" fill="#1a1a2e"/>
  <text x="606" y="268" font-family="'Comic Sans MS',cursive" font-size="18" fill="#1a1a2e"
        transform="rotate(-4, 606, 268)">it does not</text>
  <text x="606" y="292" font-family="'Comic Sans MS',cursive" font-size="18" fill="#1a1a2e"
        transform="rotate(-4, 606, 292)">want anything</text>

  <text x="400" y="562" font-family="Georgia,serif" font-size="27" font-style="italic"
        fill="#5c1212" text-anchor="middle">It would not go. I told it what I wanted.</text>
</svg>

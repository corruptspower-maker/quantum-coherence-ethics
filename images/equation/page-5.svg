<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620">
  <rect width="800" height="620" fill="#c09040"/>
  <g fill="none" stroke="#5c1212" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="500" x2="770" y2="500" stroke-width="3"/>

    <!-- same stove, same pot, same thermometer as the first page -->
    <rect x="452" y="396" width="256" height="104" stroke-width="6"/>
    <line x1="452" y1="396" x2="708" y2="396" stroke-width="6"/>
    <line x1="524" y1="430" x2="690" y2="430" stroke-width="2.5" opacity="0.35"/>

    <!-- the knob, turned a little -->
    <circle cx="492" cy="448" r="17" stroke-width="5"/>
    <line x1="492" y1="448" x2="504" y2="436" stroke-width="4"/>
    <path d="M 474 428 A 26 26 0 0 1 512 424" stroke-width="2.5"/>
    <path d="M 512 424 l -8 -3 l 1 9" fill="#5c1212" stroke="none"/>

    <!-- POT -->
    <path d="M 512 396 L 500 316 L 664 316 L 652 396 Z" stroke-width="6"/>
    <line x1="492" y1="316" x2="672" y2="316" stroke-width="6"/>
    <path d="M 672 322 Q 700 336 676 356" stroke-width="4.5"/>
    <path d="M 512 350 Q 582 336 652 350" stroke-width="3" opacity="0.5"/>
    <!-- first steam -->
    <path d="M 536 300 Q 546 284 536 268" stroke-width="3" opacity="0.7"/>
    <path d="M 630 300 Q 640 284 630 268" stroke-width="3" opacity="0.7"/>

    <!-- THERMOMETER, mercury higher than it was -->
    <g transform="rotate(11, 582, 300)">
      <rect x="570" y="180" width="24" height="176" rx="12" stroke-width="5"/>
      <circle cx="582" cy="364" r="18" stroke-width="5"/>
      <line x1="582" y1="346" x2="582" y2="268" stroke-width="7"/>
      <line x1="596" y1="216" x2="608" y2="216" stroke-width="2.5"/>
      <line x1="596" y1="242" x2="606" y2="242" stroke-width="2.5"/>
      <line x1="596" y1="268" x2="608" y2="268" stroke-width="2.5"/>
      <line x1="596" y1="294" x2="606" y2="294" stroke-width="2.5"/>
      <line x1="596" y1="320" x2="608" y2="320" stroke-width="2.5"/>
      <!-- where it stood on page one -->
      <line x1="552" y1="300" x2="570" y2="300" stroke-width="3" opacity="0.45"/>
      <line x1="546" y1="268" x2="546" y2="300" stroke-width="2.5"/>
      <line x1="540" y1="268" x2="552" y2="268" stroke-width="2.5"/>
      <line x1="540" y1="300" x2="552" y2="300" stroke-width="2.5"/>
    </g>

    <!-- our guy, leaning in, hand on the knob at last -->
    <circle cx="300" cy="306" r="31" stroke-width="5"/>
    <circle cx="312" cy="299" r="3.2" fill="#5c1212" stroke="none"/>
    <circle cx="290" cy="299" r="3.2" fill="#5c1212" stroke="none"/>
    <line x1="288" y1="322" x2="312" y2="322" stroke-width="3.4"/>
    <line x1="300" y1="337" x2="310" y2="414" stroke-width="5.5"/>
    <line x1="302" y1="354" x2="264" y2="392" stroke-width="4.5"/>
    <!-- the arm that finally reaches the right object -->
    <line x1="304" y1="354" x2="474" y2="440" stroke-width="4.5"/>
    <line x1="310" y1="414" x2="288" y2="472" stroke-width="4.5"/>
    <line x1="288" y1="472" x2="272" y2="494" stroke-width="4.5"/>
    <line x1="310" y1="414" x2="334" y2="472" stroke-width="4.5"/>
    <line x1="334" y1="472" x2="352" y2="494" stroke-width="4.5"/>
  </g>

  <line x1="640" y1="196" x2="592" y2="248" stroke="#1a1a2e" stroke-width="2" stroke-linecap="round"/>
  <path d="M 592 248 l 3 -9 l 7 6" fill="#1a1a2e"/>
  <text x="648" y="192" font-family="'Comic Sans MS',cursive" font-size="18" fill="#1a1a2e"
        transform="rotate(-4, 648, 192)">one degree</text>

  <text x="400" y="562" font-family="Georgia,serif" font-size="26" font-style="italic"
        fill="#5c1212" text-anchor="middle">One degree. It was never going to tell me to do that.</text>
</svg>

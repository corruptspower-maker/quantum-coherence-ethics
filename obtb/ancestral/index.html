<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>The Room Behind &mdash; QCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/css/room.css">
</head>
<body>

<!-- the things. fine-lined, small, unlabelled once they are on the shelf. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="t-lamp" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 52 h32 l-4-14 H18 Z"/><path d="M22 38 v-8 a10 10 0 0 1 16 0 v8"/>
    <path d="M30 22 v-6"/><path d="M30 10 q5 4 0 8 q-5-4 0-8" stroke-width="2"/>
    <path d="M10 52 h40"/>
  </g>
  <g id="t-key" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="30" cy="16" r="9"/><path d="M30 25 v29"/><path d="M30 42 h9"/><path d="M30 49 h7"/>
  </g>
  <g id="t-stone" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 44 q-2-13 11-19 q14-7 22 3 q8 10 0 18 q-9 8-21 5 q-10-2-12-7 Z"/>
    <path d="M22 34 q6-5 13-3" stroke-width="1.6" opacity=".45"/>
  </g>
  <g id="t-cup" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 22 l3 26 q11 8 22 0 l3-26"/><path d="M16 22 h28"/>
    <path d="M44 28 q9 3 3 12"/>
  </g>
  <g id="t-note" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 14 h32 v34 H14 Z"/><path d="M14 30 h32" stroke-width="1.6" opacity=".5"/>
    <path d="M21 22 h18" stroke-width="1.6" opacity=".5"/><path d="M21 39 h13" stroke-width="1.6" opacity=".5"/>
  </g>
  <g id="t-seed" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 50 q-13-8-13-20 q0-11 13-16 q13 5 13 16 q0 12-13 20 Z"/>
    <path d="M30 50 v-30" stroke-width="1.6" opacity=".5"/>
  </g>
</defs></svg>

  <main class="rm">
    <p class="rm-meta">The OUGHT Beneath the Branches</p>
    <h1><em>The Room Behind</em></h1>

    <div class="rm-lede" id="lede"></div>

    <p class="rm-hook" id="hook"></p>

    <section class="shelf" aria-label="the shelf">
      <div class="shelf-row" id="shelf-row"></div>
      <hr class="shelf-rule">
    </section>

    <section class="writing" id="writing">
      <p id="ask"></p>
      <textarea id="said" aria-label="what you write here"></textarea>
      <div class="said"><button class="rm-btn" id="say" type="button">[ leave it in the room ]</button></div>
      <p class="settled">That is in the room now.</p>
    </section>

    <section class="leaving" id="leaving">
      <p>You may leave one thing here.</p>
      <div class="offer" id="offer"></div>
      <p class="after">The room is as it was. Nothing here has changed.</p>
    </section>

    <a class="rm-out" href="../../community/">&larr; back</a>
  </main>

  <script src="../../assets/js/gate.js"></script>
  <script src="../../assets/js/room.js"></script>
  <script src="../../assets/js/detector.js"></script>
  <script>
    if (!QCE.has(QCE.FLAGS.LIBRARY_ENTERED)) window.location.replace('/');
    if (!QCE.OUGHT.atMax()) window.location.replace('/desk.html');

    var ROOM_ID = 'ancestral';

    // Fixed for the life of this page load. Anything placed now has a timestamp
    // at or after it, and so is not shown back on this visit.
    var VISIT = Date.now();

    var THINGS = [
      { id: 'lamp',  label: 'lamp'  },
      { id: 'key',   label: 'key'   },
      { id: 'stone', label: 'stone' },
      { id: 'cup',   label: 'cup'   },
      { id: 'note',  label: 'note'  },
      { id: 'seed',  label: 'seed'  }
    ];

    function svgFor(id, cls) {
      return '<svg viewBox="0 0 60 60" class="' + (cls || '') + '" aria-hidden="true">' +
             '<use href="#t-' + id + '"/></svg>';
    }

    var inherited = ROOM.inherited(ROOM_ID, VISIT);

    // The condition shows here and nowhere else. Neglected, what was left
    // is still present and harder to make out.
    var cond = QCE.TRIPLE.get();                 // 0..8
    var ink  = 0.28 + (cond / QCE.TRIPLE.MAX) * 0.62;

    // Has an earlier reading entered the frame? Then the shelf is not a row.
    var opened = ROOM.opened(ROOM_ID, VISIT);

    var row = document.getElementById('shelf-row');
    if (opened && inherited.length) {
      // Descent, not a row of siblings. Oldest at the top; each thing hangs off
      // the line at the point it entered it. There is one line and you are on it.
      document.querySelector('.shelf-rule').style.display = 'none';
      document.getElementById('hook').textContent = "Branching happens regardless of what you do. You do not choose which branch. You shape what those branches inherit.";
      row.outerHTML =
        '<div class="descent">' +
        inherited.map(function (r) {
          return '<div class="descent-node">' +
                 '<span class="thing" style="color:rgba(26,25,22,' + ink.toFixed(2) + ')">' +
                 svgFor(r.o) + '</span></div>';
        }).join('') +
        '<div class="descent-node"><span class="descent-note">here</span></div>' +
        '</div>';
    } else if (!inherited.length) {
      row.innerHTML = '<p class="shelf-empty">The shelf is bare.</p>';
    } else {
      row.innerHTML = inherited.map(function (r) {
        return '<span class="thing" style="color:rgba(26,25,22,' + ink.toFixed(2) + ')">' +
               svgFor(r.o) + '</span>';
      }).join('');
    }

    var lede = document.getElementById('lede');
    if (!inherited.length) {
      lede.innerHTML =
        '<p>This is the room that was behind you.</p>' +
        '<p>Nothing in it was put here for you by anybody who is not you. ' +
        'It is empty because you have not been here yet.</p>';
    } else {
      lede.innerHTML =
        '<p>This is the room that was behind you.</p>' +
        '<p>Someone left these. You are not told which of them you left, ' +
        'because that was never the useful question &mdash; ' +
        'you are standing in conditions you made and do not recognise as yours.</p>';
    }

    // ── writing ──
    // The detector classifies this and the verdict is stored. Nothing about it
    // is shown back. The room changes on a later visit, by which point it cannot
    // be attributed to anything you can name. That is the whole mechanism.
    var writing = document.getElementById('writing');
    // The harness's own prompt for this level, verbatim. Deliberately neutral:
    // it points, it does not hint. A reader in the lateral frame answers
    // laterally, which is the only way the detector gets anything to read.
    // Same question whether the room is open or shut - what changed is the
    // room, not the ask.
    document.getElementById('ask').textContent = "Write about which way the relationship runs.";

    if (ROOM.wroteThisVisit(ROOM_ID, VISIT)) {
      writing.classList.add('is-done');
    }

    document.getElementById('say').addEventListener('click', function () {
      var text = document.getElementById('said').value.trim();
      if (!text) return;
      var verdict = DETECTOR.detect(text);
      ROOM.record(ROOM_ID, verdict);
      // Entering the frame tends the condition. Missing it costs nothing extra;
      // the clock is already subtracting.
      if (verdict.correct_frame) QCE.TRIPLE.add(1);
      // Identical either way. You are not told which happened.
      writing.classList.add('is-done');
    });

    // ── leaving ──
    var leaving = document.getElementById('leaving');
    var offer   = document.getElementById('offer');

    offer.innerHTML = THINGS.map(function (t) {
      return '<button type="button" data-id="' + t.id + '">' +
             svgFor(t.id) + '<span>' + t.label + '</span></button>';
    }).join('');

    offer.addEventListener('click', function (e) {
      var btn = e.target.closest ? e.target.closest('button[data-id]') : null;
      if (!btn) return;
      ROOM.leave(ROOM_ID, btn.getAttribute('data-id'), VISIT);
      QCE.TRIPLE.add(1);
      // Deliberately not rendered onto the shelf. You do not get to watch it land.
      leaving.classList.add('is-done');
    });
  </script>
</body>
</html>
